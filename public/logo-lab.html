<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stebup — Logo Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F5F2;
      --card-bg: #FFFFFF;
      --card-border: #E5E3DC;
      --text-main: #111113;
      --text-muted: #6E6D68;
      --c1: #111113; /* Primary Color: Wordmark & B Rounds */
      --c2: #71717A; /* Secondary Color: E Horizontal Slips / Step Accent */
    }

    body.dark {
      --bg: #0B0B0E;
      --card-bg: #141419;
      --card-border: #24242C;
      --text-main: #F4F4F6;
      --text-muted: #8E8E99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-title span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--bg);
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .control-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 0 6px;
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: rgba(128, 128, 128, 0.1);
    }

    .btn.active {
      background: var(--text-main);
      color: var(--card-bg);
    }

    .swatch-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(128,128,128,0.25);
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--card-border);
      border-radius: 4px;
    }

    .tab-bar {
      max-width: 1360px;
      margin: 24px auto 0;
      padding: 0 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .tab-btn.active {
      background: var(--text-main);
      color: var(--card-bg);
      border-color: var(--text-main);
    }

    .tab-count {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(128, 128, 128, 0.18);
    }

    .tab-desc-banner {
      max-width: 1360px;
      margin: 16px auto 0;
      padding: 0 32px;
    }

    .tab-desc-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      line-height: 1.5;
    }

    .tab-desc-box strong {
      color: var(--text-main);
    }

    .container {
      max-width: 1360px;
      margin: 20px auto 0;
      padding: 0 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(410px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08);
    }

    .stage {
      height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
      border-bottom: 1px solid var(--card-border);
    }

    .stage svg.mark-svg {
      width: 140px;
      height: 140px;
      overflow: visible;
    }

    .grid:has(.card:only-child) {
      grid-template-columns: minmax(320px, 780px);
      justify-content: center;
    }

    .grid:has(.card:only-child) .stage {
      height: 430px;
    }

    .grid:has(.card:only-child) .stage svg.mark-svg {
      width: 290px;
      height: 290px;
    }

    .stage svg.word-svg {
      width: 100%;
      max-width: 345px;
      height: auto;
      overflow: visible;
      display: none;
    }

    .wordmark-lockup {
      display: none;
      align-items: center;
      gap: 14px;
    }

    body.show-lockup .stage > svg.mark-svg,
    body.auto-mixed .stage.is-word > svg.mark-svg {
      display: none;
    }

    body.show-lockup .stage > svg.word-svg,
    body.auto-mixed .stage.is-word > svg.word-svg {
      display: block;
    }

    body.show-lockup .stage .wordmark-lockup {
      display: flex;
    }

    .wordmark-lockup svg {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .wordmark-text {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--c1);
      line-height: 1;
    }

    .wordmark-text em {
      font-style: normal;
      color: var(--c2);
    }

    .guide-line {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    body.show-guides .guide-line {
      opacity: 1;
    }

    .mini-preview {
      position: absolute;
      bottom: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--card-border);
    }

    .mini-preview svg.mini-word {
      width: 86px;
      height: 24px;
    }

    .mini-preview svg.mini-mark {
      width: 22px;
      height: 22px;
    }

    .mini-preview span {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--c1);
    }

    .num-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .cat-pill {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .info {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .info-text h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .info-text p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .dl-btn {
      flex-shrink: 0;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-main);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .dl-btn:hover {
      border-color: var(--text-main);
    }

    @media (max-width: 768px) {
      header { padding: 14px 16px; }
      .tab-bar, .tab-desc-banner, .container { padding: 0 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="auto-mixed">

  <header>
    <div class="controls">
      <div class="control-group">
        <span class="control-label">Colors</span>
        <button class="btn" onclick="setPalette('#111113', '#7C3AED', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #7C3AED 50%)"></i>
          Ink + Violet
        </button>
        <button class="btn" onclick="setPalette('#111113', '#F59E0B', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #F59E0B 50%)"></i>
          Ink + Gold
        </button>
        <button class="btn" onclick="setPalette('#0F172A', '#2563EB', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #0F172A 50%, #2563EB 50%)"></i>
          Navy + Blue
        </button>
        <button class="btn" onclick="setPalette('#111113', '#10B981', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #10B981 50%)"></i>
          Ink + Emerald
        </button>
        <button class="btn active" onclick="setPalette('#111113', '#71717A', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #71717A 50%)"></i>
          Monochrome
        </button>
        <div class="color-picker-wrap" title="Pick Custom Colors">
          <input type="color" id="picker1" value="#111113" oninput="customColor()" />
          <input type="color" id="picker2" value="#71717A" oninput="customColor()" />
        </div>
      </div>
    </div>
  </header>

  <!-- Category Tabs -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="setTab('master', this)">
      Master Lab <span class="tab-count">1</span>
    </button>
    <button class="tab-btn" onclick="setTab('improvised', this)">
      Improvised <span class="tab-count">13</span>
    </button>
  </nav>

  <main class="container">
    <div class="grid" id="logoGrid"></div>
  </main>

  <script>
    // Precision geometric paths for S, T (left of EB) and U, P (right of EB)
    // Cap-height: y = 28 | Baseline: y = 92 | Total Height = 64px | Stroke = 14px
    const ST_PATH = `
      <!-- S (x=16..64, y=28..92, 14px stroke) -->
      <path d="
        M62 28 H32 C22 28 16 34 16 44 C16 54 22 60 34 62 L46 64 C50 65 51 67 51 71 C51 75 48 78 42 78 H16 V92 H44 C56 92 64 85 64 73 C64 62 58 56 45 54 L34 52 C30 51 29 49 29 45 C29 43 31 42 36 42 H62 V28 Z
      " fill="var(--c1)" />
      <!-- T (x=72..120, y=28..92, 14px stroke) -->
      <path d="M72 28 H120 V42 H103 V92 H89 V42 H72 V28 Z" fill="var(--c1)" />
    `;

    const UP_PATH = `
      <!-- U (x=244..294, y=28..92, 14px stroke) -->
      <path d="
        M244 28 H258 V68 C258 75 262 78 269 78 C276 78 280 75 280 68 V28 H294 V69 C294 84 284 92 269 92 C254 92 244 84 244 69 V28 Z
      " fill="var(--c1)" />
      <!-- P (x=304..354, y=28..92, 14px stroke) -->
      <path fill-rule="evenodd" clip-rule="evenodd" d="
        M304 28 H334 C346 28 354 36 354 48 C354 60 346 68 334 68 H318 V92 H304 V28 Z
        M318 42 V54 H332 C337 54 340 52 340 48 C340 44 337 42 332 42 H318 Z
      " fill="var(--c1)" />
    `;

    const GUIDE_LINES = `
      <line class="guide-line" x1="6" y1="28" x2="364" y2="28" stroke="#EF4444" stroke-width="1" stroke-dasharray="4 3" />
      <line class="guide-line" x1="6" y1="92" x2="364" y2="92" stroke="#EF4444" stroke-width="1" stroke-dasharray="4 3" />
    `;

    function makeWordConcept(id, cat, catLabel, title, desc, ebPaths, customWordSvg = null) {
      return {
        id,
        cat,
        catLabel,
        isSeamlessEB: true,
        title,
        desc,
        wordSvg: customWordSvg || `
          ${GUIDE_LINES}
          ${ST_PATH}
          ${ebPaths}
          ${UP_PATH}
        `,
        markViewBox: "118 16 126 88",
        svg: ebPaths
      };
    }

    const concepts = [
      {
        id: "86",
        cat: "master",
        catLabel: "Master Lab · Perceptual Sculpture",
        title: "The Ascent Paradox — Impossible Mobius-Staircase 'EB'",
        desc: "A 5-layer optical sculpture: (1) 3 horizontal isometric terraces on the left form 'E', (2) each flat step physically twists 90° in 3D space to become the vertical sweeping vaults of 'B', (3) together they form an infinite upward Penrose loop, (4) the central negative-space fissure carves an ascending prism breaking through the upper horizon, and (5) micro-guilloché contour filaments give carved architectural depth.",
        svg: `
          <defs>
            <!-- Soft architectural levitation shadow -->
            <filter id="sculpt-ao" x="-15%" y="-15%" width="130%" height="135%">
              <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="var(--c1)" flood-opacity="0.16" />
            </filter>

            <!-- Zenith-lit top terrace surfaces (Step treads) -->
            <linearGradient id="tread-top" x1="0%" y1="0%" x2="100%" y2="20%">
              <stop offset="0%" stop-color="var(--c2)" stop-opacity="0.32" />
              <stop offset="48%" stop-color="var(--c2)" stop-opacity="0.72" />
              <stop offset="85%" stop-color="var(--c1)" stop-opacity="0.88" />
              <stop offset="100%" stop-color="var(--c1)" stop-opacity="1" />
            </linearGradient>

            <!-- Shadowed vertical step risers (Front faces of E steps) -->
            <linearGradient id="riser-front" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--c1)" stop-opacity="0.96" />
              <stop offset="65%" stop-color="var(--c1)" stop-opacity="0.78" />
              <stop offset="100%" stop-color="var(--c2)" stop-opacity="0.55" />
            </linearGradient>

            <!-- Upper Mobius B-Vault: twists from lit terrace into deep sculptural arch -->
            <linearGradient id="mobius-upper" x1="15%" y1="0%" x2="95%" y2="100%">
              <stop offset="0%" stop-color="var(--c1)" stop-opacity="1" />
              <stop offset="42%" stop-color="var(--c1)" stop-opacity="0.86" />
              <stop offset="78%" stop-color="var(--c2)" stop-opacity="0.92" />
              <stop offset="100%" stop-color="var(--c1)" stop-opacity="0.98" />
            </linearGradient>

            <!-- Lower Mobius B-Vault: sweeping chiaroscuro roll -->
            <linearGradient id="mobius-lower" x1="10%" y1="10%" x2="95%" y2="95%">
              <stop offset="0%" stop-color="var(--c2)" stop-opacity="0.88" />
              <stop offset="38%" stop-color="var(--c1)" stop-opacity="0.95" />
              <stop offset="76%" stop-color="var(--c1)" stop-opacity="1" />
              <stop offset="100%" stop-color="var(--c2)" stop-opacity="0.65" />
            </linearGradient>

            <!-- Deep interior recessed vault wall (Ambient Occlusion inside B loops) -->
            <linearGradient id="vault-recess" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="var(--c1)" stop-opacity="0.45" />
              <stop offset="50%" stop-color="var(--c2)" stop-opacity="0.22" />
              <stop offset="100%" stop-color="var(--c1)" stop-opacity="0.62" />
            </linearGradient>

            <!-- Central Singularity / Ascent Spire glow -->
            <linearGradient id="spire-beam" x1="50%" y1="100%" x2="50%" y2="0%">
              <stop offset="0%" stop-color="var(--c2)" stop-opacity="0.0" />
              <stop offset="45%" stop-color="var(--c2)" stop-opacity="0.35" />
              <stop offset="100%" stop-color="var(--c1)" stop-opacity="0.9" />
            </linearGradient>
          </defs>

          <!-- LAYER 0: Subtle Parametric Gravitational / Guilloché Horizon Field -->
          <g fill="none" stroke="var(--c2)" stroke-linecap="round">
            <path d="M18 114 C48 111 86 111 112 114" stroke-width="0.5" stroke-opacity="0.22" />
            <path d="M12 118 C48 114 88 114 116 118" stroke-width="0.4" stroke-opacity="0.14" />
            <!-- Zenith breakthrough harmonic arcs radiating above the top step -->
            <path d="M46 13 C56 8 68 8 78 13" stroke-width="0.55" stroke-opacity="0.32" />
            <path d="M51 9 C58 5.5 66 5.5 73 9" stroke-width="0.45" stroke-opacity="0.2" />
          </g>

          <g filter="url(#sculpt-ao)">
            <!-- ================================================================= -->
            <!-- LAYER 1: IMPOSSIBLE ESCHER PENROSE RISERS (Hidden left pillars)   -->
            <!-- Connects Step 1 -> Step 2 -> Step 3 in an impossible depth loop   -->
            <!-- ================================================================= -->
            <!-- Deep recessed pillar rising from Step 1 back-edge into Step 2 underside -->
            <polygon points="22,82 31,76 31,58 22,64" fill="var(--c1)" fill-opacity="0.28" />
            <polygon points="31,76 37,79 37,61 31,58" fill="var(--c2)" fill-opacity="0.18" />
            <!-- Deep recessed pillar rising from Step 2 back-edge into Step 3 underside -->
            <polygon points="32,49 41,43 41,25 32,31" fill="var(--c1)" fill-opacity="0.28" />
            <polygon points="41,43 47,46 47,28 41,25" fill="var(--c2)" fill-opacity="0.18" />

            <!-- ================================================================= -->
            <!-- LAYER 2: INNER RECESSED VAULT WALLS OF 'B' (3D Depth Undersides)  -->
            <!-- Creates the illusion of hollow carved tunnels inside B's 2 loops  -->
            <!-- ================================================================= -->
            <!-- Upper B loop interior tunnel wall -->
            <path d="
              M66 28 H88 C99 28 106 33.5 106 41.5 C106 49.5 99 55 88 55 H66 V48 H85 C92.5 48 96.5 45.5 96.5 41.5 C96.5 37.5 92.5 35 85 35 H66 V28 Z
            " fill="url(#vault-recess)" />
            <!-- Lower B loop interior tunnel wall -->
            <path d="
              M62 67 H89 C102 67 110 73.5 110 83 C110 92.5 102 99 89 99 H60 V91 H86 C94.5 91 99.5 88 99.5 83 C99.5 78 94.5 75 86 75 H62 V67 Z
            " fill="url(#vault-recess)" />

            <!-- ================================================================= -->
            <!-- LAYER 3: THE 3 ASCENDING STEP TERRACES ('E') TWISTING INTO 'B'    -->
            <!-- Each step has a zenith-lit top plane + dark vertical front riser  -->
            <!-- ================================================================= -->

            <!-- STEP 1 (FOUNDATION: Bottom-Left) -> Twists into Lower B Base -->
            <!-- Lit Top Plane of Step 1 (Tilted in isometric perspective) -->
            <path d="
              M8 90 L20 81 H56 L53 90 H8 Z
            " fill="url(#tread-top)" />
            <!-- Shadowed Vertical Front Riser of Step 1 sweeping into Lower B Arch -->
            <path d="
              M8 90 H53 L56 101 H8 V90 Z
            " fill="url(#riser-front)" />

            <!-- STEP 2 (THRESHOLD: Middle-Left) -> Dovetails into B Waist -->
            <!-- Lit Top Plane of Step 2 -->
            <path d="
              M18 57 L30 48 H58 L55 57 H18 Z
            " fill="url(#tread-top)" />
            <!-- Shadowed Vertical Front Riser of Step 2 -->
            <path d="
              M18 57 H55 L58 68 H18 V57 Z
            " fill="url(#riser-front)" />

            <!-- STEP 3 (ZENITH: Top-Left) -> Launches into Upper B Crown -->
            <!-- Lit Top Plane of Step 3 -->
            <path d="
              M28 24 L40 15 H60 L57 24 H28 Z
            " fill="url(#tread-top)" />
            <!-- Shadowed Vertical Front Riser of Step 3 -->
            <path d="
              M28 24 H57 L60 35 H28 V24 Z
            " fill="url(#riser-front)" />

            <!-- ================================================================= -->
            <!-- LAYER 4: THE MOBIUS 'B' VAULTS (Twisting 90° in 3D Space)         -->
            <!-- ================================================================= -->
            <!-- Upper Mobius Ribbon: emerges from Top Zenith (x=66,y=15), sweeps  -->
            <!-- around upper B bowl, and twists into the Middle Waist (x=64,y=67) -->
            <path d="
              M66 15 H90 C106 15 116 24.5 116 39 C116 49.5 109.5 57 99 60.5
              C91 63 80 65.5 64 66.5 L67 55.5 H88 C97.5 55.5 103 50 103 42
              C103 33.5 97 28 87 28 H63 L66 15 Z
            " fill="url(#mobius-upper)" />

            <!-- Lower Mobius Ribbon: emerges from Middle Waist twist (x=68,y=56), -->
            <!-- cantilevers out to x=119, and folds into the Foundation base      -->
            <path d="
              M67 55.5 H91 C108 55.5 119 65.5 119 81.5 C119 97.5 107.5 108 89 108
              H59 L56 95 H87 C97.5 95 104.5 89.5 104.5 81 C104.5 72.5 98 67 88 67
              H64 L67 55.5 Z
            " fill="url(#mobius-lower)" />

            <!-- Impossible Escher Fold-Back: connects B's bottom foundation (59,108) -->
            <!-- back under Step 1 (20,108 -> 8,101) so the loop has no beginning or end -->
            <polygon points="8,101 56,101 59,108 16,108" fill="var(--c1)" fill-opacity="0.42" />

            <!-- ================================================================= -->
            <!-- LAYER 5: GUILLOCHÉ ENGRAVING & SPECULAR ARCHITECTURAL EDGES       -->
            <!-- Gives currency-grade linework & destroys the "flat SVG" feel      -->
            <!-- ================================================================= -->
            <g fill="none" stroke="var(--card-bg)" stroke-opacity="0.28" stroke-width="0.55">

    let activeTab = 'master';
    const grid = document.getElementById('logoGrid');

    function setTab(tab, btn) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      if (tab === 'master' || tab === 'improvised') {
        document.body.classList.remove('show-lockup');
        document.body.classList.add('auto-mixed');
      } else if (tab === 'wordmarks') {
        document.body.classList.remove('auto-mixed');
        document.body.classList.add('show-lockup');
      } else {
        document.body.classList.remove('auto-mixed');
        document.body.classList.remove('show-lockup');
      }
      render();
    }

            <div class="card">
              <div class="stage is-word">
                <span class="num-badge">#${item.id}</span>
                <span class="cat-pill">${item.catLabel}</span>

                <!-- Standalone EB Symbol (when in Symbol Only view) -->
                <svg class="mark-svg" viewBox="${item.markViewBox}" fill="none" xmlns="http://www.w3.org/2000/svg">
                  ${item.svg}
                </svg>

                <!-- Full Seamless STEBUP Wordmark -->
                <svg class="word-svg" viewBox="0 0 370 120" fill="none" xmlns="http://www.w3.org/2000/svg" id="svg-${item.id}">
                  ${item.wordSvg}
                </svg>

                <!-- Mini Navbar Scale Preview -->
                <div class="mini-preview" title="Navbar Scale Preview">
                  <svg class="mini-word" viewBox="0 0 370 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    ${item.wordSvg}
                  </svg>
                </div>
              </div>

              <div class="info">
                <div class="info-text">
                  <h2>${item.title}</h2>
                  <p>${item.desc}</p>
                </div>
                <button class="dl-btn" onclick="downloadSvg('${item.id}', '${item.title}')">SVG</button>
              </div>
            </div>
          `;
        }

        return `
          <div class="card">
            <div class="stage">
              <span class="num-badge">#${item.id}</span>
              <span class="cat-pill">${item.catLabel}</span>

              <svg class="mark-svg" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" id="svg-${item.id}">
                ${item.svg}
              </svg>

              <div class="wordmark-lockup">
                <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                  ${item.svg}
                </svg>
                <span class="wordmark-text">Ste<em>b</em>up</span>
              </div>

              <div class="mini-preview" title="Navbar Scale Preview">
                <svg class="mini-mark" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                  ${item.svg}
                </svg>
                <span>STEBUP</span>
              </div>
            </div>

            <div class="info">
              <div class="info-text">
                <h2>${item.title}</h2>
                <p>${item.desc}</p>
              </div>
              <button class="dl-btn" onclick="downloadSvg('${item.id}', '${item.title}')">SVG</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setPalette(c1, c2, btn) {
      const isDark = document.body.classList.contains('dark');
      const resolvedC1 = (isDark && (c1 === '#111113' || c1 === '#0F172A')) ? '#F4F4F6' : c1;
      document.documentElement.style.setProperty('--c1', resolvedC1);
      document.documentElement.style.setProperty('--c2', c2);
      document.getElementById('picker1').value = resolvedC1;
      document.getElementById('picker2').value = c2;

      if (btn) {
        document.querySelectorAll('.control-group:first-child .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    }

    function customColor() {
      const c1 = document.getElementById('picker1').value;
      const c2 = document.getElementById('picker2').value;
      document.documentElement.style.setProperty('--c1', c1);
      document.documentElement.style.setProperty('--c2', c2);
      document.querySelectorAll('.control-group:first-child .btn').forEach(b => b.classList.remove('active'));
    }

    function setView(mode) {
      document.body.classList.remove('auto-mixed');
      document.body.classList.toggle('show-lockup', mode === 'lockup');
    }

    function toggleGuides() {
      const active = document.body.classList.toggle('show-guides');
      document.getElementById('guideBtn').classList.toggle('active', active);
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      document.getElementById('themeBtn').textContent = isDark ? 'Light BG' : 'Dark BG';
      const currentC1 = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
      if (isDark && (currentC1 === '#111113' || currentC1 === '#0F172A')) {
        document.documentElement.style.setProperty('--c1', '#F4F4F6');
        document.getElementById('picker1').value = '#F4F4F6';
      } else if (!isDark && currentC1 === '#F4F4F6') {
        document.documentElement.style.setProperty('--c1', '#111113');
        document.getElementById('picker1').value = '#111113';
      }
    }

    function downloadSvg(id, title) {
      const svgEl = document.getElementById('svg-' + id);
      const c1 = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
      const c2 = getComputedStyle(document.documentElement).getPropertyValue('--c2').trim();
      let raw = svgEl.outerHTML
        .replaceAll('var(--c1)', c1)
        .replaceAll('var(--c2)', c2);
      const blob = new Blob([raw], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `stebup-wordmark-${id}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    render();
  </script>
</body>
</html>
