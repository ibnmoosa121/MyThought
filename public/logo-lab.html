<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stebup — Logo Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F5F2;
      --card-bg: #FFFFFF;
      --card-border: #E5E3DC;
      --text-main: #111113;
      --text-muted: #6E6D68;
      --c1: #111113; /* Primary Color: Wordmark & B Rounds */
      --c2: #71717A; /* Secondary Color: E Horizontal Slips / Step Accent */
    }

    body.dark {
      --bg: #0B0B0E;
      --card-bg: #141419;
      --card-border: #24242C;
      --text-main: #F4F4F6;
      --text-muted: #8E8E99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-title span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--bg);
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .control-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 0 6px;
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: rgba(128, 128, 128, 0.1);
    }

    .btn.active {
      background: var(--text-main);
      color: var(--card-bg);
    }

    .swatch-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(128,128,128,0.25);
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--card-border);
      border-radius: 4px;
    }

    .tab-bar {
      max-width: 1360px;
      margin: 24px auto 0;
      padding: 0 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .tab-btn.active {
      background: var(--text-main);
      color: var(--card-bg);
      border-color: var(--text-main);
    }

    .tab-count {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(128, 128, 128, 0.18);
    }

    .tab-desc-banner {
      max-width: 1360px;
      margin: 16px auto 0;
      padding: 0 32px;
    }

    .tab-desc-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      line-height: 1.5;
    }

    .tab-desc-box strong {
      color: var(--text-main);
    }

    .container {
      max-width: 1360px;
      margin: 20px auto 0;
      padding: 0 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(410px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08);
    }

    .stage {
      height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
      border-bottom: 1px solid var(--card-border);
    }

    .stage svg.mark-svg {
      width: 140px;
      height: 140px;
      overflow: visible;
    }

    .grid:has(.card:only-child) {
      grid-template-columns: minmax(320px, 780px);
      justify-content: center;
    }

    .grid:has(.card:only-child) .stage {
      height: 430px;
    }

    .grid:has(.card:only-child) .stage svg.mark-svg {
      width: 290px;
      height: 290px;
    }

    .stage svg.word-svg {
      width: 100%;
      max-width: 345px;
      height: auto;
      overflow: visible;
      display: none;
    }

    .wordmark-lockup {
      display: none;
      align-items: center;
      gap: 14px;
    }

    body.show-lockup .stage > svg.mark-svg,
    body.auto-mixed .stage.is-word > svg.mark-svg {
      display: none;
    }

    body.show-lockup .stage > svg.word-svg,
    body.auto-mixed .stage.is-word > svg.word-svg {
      display: block;
    }

    body.show-lockup .stage .wordmark-lockup {
      display: flex;
    }

    .wordmark-lockup svg {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .wordmark-text {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--c1);
      line-height: 1;
    }

    .wordmark-text em {
      font-style: normal;
      color: var(--c2);
    }

    .guide-line {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    body.show-guides .guide-line {
      opacity: 1;
    }

    .mini-preview {
      position: absolute;
      bottom: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--card-border);
    }

    .mini-preview svg.mini-word {
      width: 86px;
      height: 24px;
    }

    .mini-preview svg.mini-mark {
      width: 22px;
      height: 22px;
    }

    .mini-preview span {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--c1);
    }

    .num-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .cat-pill {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .info {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .info-text h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .info-text p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .dl-btn {
      flex-shrink: 0;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-main);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .dl-btn:hover {
      border-color: var(--text-main);
    }

    /* Export Kit (#85) Styles */
    .kit-wrap {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .kit-banner {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .kit-banner h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .kit-banner p {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 580px;
      line-height: 1.5;
    }
    .kit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .kit-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .kit-card.full { grid-column: 1 / -1; }
    .kit-previews {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }
    .kit-preview {
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #FFFFFF;
      position: relative;
    }
    .kit-preview.is-dark {
      background: #0B0B0E;
      border-left: 1px solid var(--border);
    }
    .kit-preview-tag {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 10px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #71717A;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .kit-preview svg.kit-word-svg {
      width: 100%;
      max-width: 280px;
      height: auto;
    }
    .kit-preview svg.kit-mark-svg {
      width: 84px;
      height: 84px;
    }
    .kit-favicon-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 24px;
      padding: 32px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--stage-bg);
      flex-wrap: wrap;
    }
    .kit-fav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--text-muted);
    }
    .kit-card-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .kit-card-body h3 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .kit-card-body p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .kit-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .kit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .kit-btn:hover {
      border-color: var(--text-main);
      background: rgba(128, 128, 128, 0.08);
    }
    .kit-btn.primary {
      background: var(--text-main);
      color: var(--card-bg);
      border-color: var(--text-main);
      padding: 10px 18px;
      font-size: 13px;
    }
    .kit-btn.primary:hover {
      opacity: 0.88;
    }
    .kit-code {
      background: #0B0B0E;
      color: #E4E4E7;
      padding: 16px 20px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;
      margin: 0;
    }

    @media (max-width: 768px) {
      header { padding: 14px 16px; }
      .tab-bar, .tab-desc-banner, .container { padding: 0 16px; }
      .grid, .kit-grid, .kit-previews { grid-template-columns: 1fr; }
      .kit-preview.is-dark { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body class="auto-mixed">

  <header>
    <div class="controls">
      <div class="control-group">
        <span class="control-label">Colors</span>
        <button class="btn" onclick="setPalette('#111113', '#7C3AED', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #7C3AED 50%)"></i>
          Ink + Violet
        </button>
        <button class="btn" onclick="setPalette('#111113', '#F59E0B', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #F59E0B 50%)"></i>
          Ink + Gold
        </button>
        <button class="btn" onclick="setPalette('#0F172A', '#2563EB', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #0F172A 50%, #2563EB 50%)"></i>
          Navy + Blue
        </button>
        <button class="btn" onclick="setPalette('#111113', '#10B981', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #10B981 50%)"></i>
          Ink + Emerald
        </button>
        <button class="btn active" onclick="setPalette('#111113', '#71717A', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #71717A 50%)"></i>
          Monochrome
        </button>
        <div class="color-picker-wrap" title="Pick Custom Colors">
          <input type="color" id="picker1" value="#111113" oninput="customColor()" />
          <input type="color" id="picker2" value="#71717A" oninput="customColor()" />
        </div>
      </div>
    </div>
  </header>

  <!-- Category Tabs -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="setTab('master', this)">
      Master Lab <span class="tab-count">1</span>
    </button>
    <button class="tab-btn" onclick="setTab('improvised', this)">
      Improvised <span class="tab-count">13</span>
    </button>
    <button class="tab-btn" onclick="setTab('kit85', this)">
      Export Kit (#85) <span class="tab-count">ZIP</span>
    </button>
  </nav>

  <main class="container">
    <div class="grid" id="logoGrid"></div>
  </main>

  <script>
    // Precision geometric paths for S, T (left of EB) and U, P (right of EB)
    // Cap-height: y = 28 | Baseline: y = 92 | Total Height = 64px | Stroke = 14px
    const ST_PATH = `
      <!-- S (x=16..64, y=28..92, 14px stroke) -->
      <path d="
        M62 28 H32 C22 28 16 34 16 44 C16 54 22 60 34 62 L46 64 C50 65 51 67 51 71 C51 75 48 78 42 78 H16 V92 H44 C56 92 64 85 64 73 C64 62 58 56 45 54 L34 52 C30 51 29 49 29 45 C29 43 31 42 36 42 H62 V28 Z
      " fill="var(--c1)" />
      <!-- T (x=72..120, y=28..92, 14px stroke) -->
      <path d="M72 28 H120 V42 H103 V92 H89 V42 H72 V28 Z" fill="var(--c1)" />
    `;

    const UP_PATH = `
      <!-- U (x=244..294, y=28..92, 14px stroke) -->
      <path d="
        M244 28 H258 V68 C258 75 262 78 269 78 C276 78 280 75 280 68 V28 H294 V69 C294 84 284 92 269 92 C254 92 244 84 244 69 V28 Z
      " fill="var(--c1)" />
      <!-- P (x=304..354, y=28..92, 14px stroke) -->
      <path fill-rule="evenodd" clip-rule="evenodd" d="
        M304 28 H334 C346 28 354 36 354 48 C354 60 346 68 334 68 H318 V92 H304 V28 Z
        M318 42 V54 H332 C337 54 340 52 340 48 C340 44 337 42 332 42 H318 Z
      " fill="var(--c1)" />
    `;

    const GUIDE_LINES = `
      <line class="guide-line" x1="6" y1="28" x2="364" y2="28" stroke="#EF4444" stroke-width="1" stroke-dasharray="4 3" />
      <line class="guide-line" x1="6" y1="92" x2="364" y2="92" stroke="#EF4444" stroke-width="1" stroke-dasharray="4 3" />
    `;

    function makeWordConcept(id, cat, catLabel, title, desc, ebPaths, customWordSvg = null) {
      return {
        id,
        cat,
        catLabel,
        isSeamlessEB: true,
        title,
        desc,
        wordSvg: customWordSvg || `
          ${GUIDE_LINES}
          ${ST_PATH}
          ${ebPaths}
          ${UP_PATH}
        `,
        markViewBox: "118 16 126 88",
        svg: ebPaths
      };
    }

    const concepts = [
      {
        id: "86",
        cat: "master",
        catLabel: "Master Lab · Pure Constructivist Geometry",
        title: "The Joinery 'B' — Interlocking 15px Staircase & Bowls",
        desc: "Zero gradients, zero decoration — two pure 15px constant-width forms locked on an 18px diagonal module. The left spine IS an unbroken 3-step staircase (Color 2), while B's three horizontal bars (Color 1) step inward at x=80, x=62, and x=44 to nest into each stair riser across a 5px negative-space channel.",
        svg: `
          <!-- Shape 1: Unbroken 15px Ascending Staircase Spine (Color 2) -->
          <path d="
            M14 97 H24 V56.5 H42 V16 H75 V31 H57 V71.5 H39 V112 H14 V97 Z
          " fill="var(--c2)" />

          <!-- Shape 2: Interlocking 15px B Bowls Stepping at x=80, x=62, x=44 (Color 1) -->
          <path d="
            M80 16 H88.5 C104.5 16 115 26.2 115 41.5 C115 51.2 109.5 58.8 100 62.8
            C110.5 66.8 117 75 117 86 C117 101.8 105.5 112 88.5 112
            H44 V97 H87 C96.5 97 102 92.8 102 84.5 C102 76.2 96.5 71.5 87 71.5
            H62 V56.5 H86 C95 56.5 100 52 100 43.8 C100 35.5 95 31 86 31
            H80 V16 Z
          " fill="var(--c1)" />
        `
      },
      {
        id: "66",
        cat: "improvised",
        catLabel: "From #54 · Tapered Fluid",
        title: "Aerodynamic Turbine-Foil 'EB'",
        desc: "Upgrades #54: sculpts E's 3 slips as curved cubic-Bezier airfoil blades converging organically into pill-softened stemless B loops across a uniform 7px channel.",
        svg: `
          <!-- 3 Curved Airfoil E-Slips with smooth terminal radii (Color 2) -->
          <path d="M27 25 C40 23 54 21 66 20 C69.3 20 72 22.7 72 26 V31 C72 34.3 69.3 37 66 37 C54 36.5 40 34.5 27 32 C24.5 31.5 23 30 23 28.5 C23 27 24.5 25.5 27 25 Z" fill="var(--c2)" />
          <path d="M16 60.5 C31 59 45 57 56 56 C59.3 56 62 58.7 62 62 V66 C62 69.3 59.3 72 56 72 C45 71 31 69.5 16 67.5 C13.5 67 12 65.6 12 64 C12 62.4 13.5 61 16 60.5 Z" fill="var(--c2)" />
          <path d="M8 96.5 C26 94.5 48 92.5 66 91.5 C69.3 91.5 72 94.2 72 97.5 V102 C72 105.3 69.3 108 66 108 C48 107.2 26 105.2 8 103.2 C5.5 102.8 4 101.4 4 99.8 C4 98.2 5.5 96.8 8 96.5 Z" fill="var(--c2)" />
          <!-- Pill-Softened Stemless B Loops across clean 7px channel (Color 1) -->
          <path d="
            M85 20 H96 C111 20 120 29 120 41.5 C120 51 113 59 102 62 C114 65 122 74 122 86 C122 99 111 108 96 108 H85 C80.6 108 77 104.4 77 100 C77 95.6 80.6 92 85 92 H94 C102 92 106 88 106 82 C106 76 102 72 94 72 H75 C70.6 72 67 68.4 67 64 C67 59.6 70.6 56 75 56 H93 C100 56 104 52 104 45.5 C104 39.5 100 36 93 36 H85 C80.6 36 77 32.4 77 28 C77 23.6 80.6 20 85 20 Z
          " fill="var(--c1)" />
        `
      },
      {
        id: "68",
        cat: "improvised",
        catLabel: "From #60 · Single Stroke",
        title: "Continuous Single-Stroke Diagonal 'EB'",
        desc: "Refines #60: mathematically parallel 16px slanted spine with 45Â° terminals forms E in one unbroken stroke, separated by an 8px parallel channel from B.",
        svg: `
          <!-- Mathematically Parallel 16px Single-Stroke Slanted E (Color 2) -->
          <path d="
            M28 20 H72 L56 36 H40.4 L35.8 56 H58 L42 72 H32.2 L27.6 92 H46 L30 108 H8 L28 20 Z
          " fill="var(--c2)" />
          <!-- Matching 45-deg Terminal Stemless B Rounds with 8px parallel gap (Color 1) -->
          <path d="
            M80 20 H96 C110 20 120 29 120 42 C120 52 113 59 102 63 C113 66 120 75 120 87 C120 100 109 108 92 108 H38 L54 92 H90 C98 92 103 88 103 81.5 C103 75.5 98 72 90 72 H50 L66 56 H92 C99 56 103 51.5 103 45 C103 39 99 36 92 36 H64 L80 20 Z
          " fill="var(--c1)" />
        `
      },

    const tabGroups = {
      master: ['master'],
      improvised: ['improvised']
    };

    let activeTab = 'master';
    const grid = document.getElementById('logoGrid');

    function setTab(tab, btn) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      if (tab === 'master' || tab === 'improvised') {
        document.body.classList.remove('show-lockup');
        document.body.classList.add('auto-mixed');
      } else if (tab === 'wordmarks') {
        document.body.classList.remove('auto-mixed');
        document.body.classList.add('show-lockup');
      } else {
        document.body.classList.remove('auto-mixed');
        document.body.classList.remove('show-lockup');
      }
    render();
    }

    function render() {
      if (activeTab === 'kit85') {
        renderKit85();
        return;
      }
      const allowedCats = tabGroups[activeTab] || [];
      const filtered = concepts.filter(c => allowedCats.includes(c.cat));

      grid.innerHTML = filtered.map(item => {
        if (item.isSeamlessEB) {
          return `
            <div class="card">
              <div class="stage is-word">
                <span class="num-badge">#${item.id}</span>
                <span class="cat-pill">${item.catLabel}</span>

                <!-- Standalone EB Symbol (when in Symbol Only view) -->
                <svg class="mark-svg" viewBox="${item.markViewBox}" fill="none" xmlns="http://www.w3.org/2000/svg">
                  ${item.svg}
                </svg>

                <!-- Full Seamless STEBUP Wordmark -->
                <svg class="word-svg" viewBox="0 0 370 120" fill="none" xmlns="http://www.w3.org/2000/svg" id="svg-${item.id}">
                  ${item.wordSvg}
                </svg>

                <!-- Mini Navbar Scale Preview -->
                <div class="mini-preview" title="Navbar Scale Preview">
                  <svg class="mini-word" viewBox="0 0 370 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    ${item.wordSvg}
                  </svg>
                </div>
              </div>

              <div class="info">
                <div class="info-text">
                  <h2>${item.title}</h2>
                  <p>${item.desc}</p>
                </div>
                <button class="dl-btn" onclick="downloadSvg('${item.id}', '${item.title}')">SVG</button>
              </div>
            </div>
          `;
        }

        return `
          <div class="card">
            <div class="stage">
              <span class="num-badge">#${item.id}</span>
              <span class="cat-pill">${item.catLabel}</span>

              <svg class="mark-svg" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" id="svg-${item.id}">
                ${item.svg}
              </svg>

              <div class="wordmark-lockup">
                <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                  ${item.svg}
                </svg>
                <span class="wordmark-text">Ste<em>b</em>up</span>
              </div>

              <div class="mini-preview" title="Navbar Scale Preview">
                <svg class="mini-mark" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                  ${item.svg}
                </svg>
                <span>STEBUP</span>
              </div>
            </div>

            <div class="info">
              <div class="info-text">
                <h2>${item.title}</h2>
                <p>${item.desc}</p>
              </div>
              <button class="dl-btn" onclick="downloadSvg('${item.id}', '${item.title}')">SVG</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setPalette(c1, c2, btn) {
      const isDark = document.body.classList.contains('dark');
      const resolvedC1 = (isDark && (c1 === '#111113' || c1 === '#0F172A')) ? '#F4F4F6' : c1;
      document.documentElement.style.setProperty('--c1', resolvedC1);
      document.documentElement.style.setProperty('--c2', c2);
      document.getElementById('picker1').value = resolvedC1;
      document.getElementById('picker2').value = c2;

      if (btn) {
        document.querySelectorAll('.control-group:first-child .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      if (activeTab === 'kit85') renderKit85();
    }

    function customColor() {
      const c1 = document.getElementById('picker1').value;
      const c2 = document.getElementById('picker2').value;
      document.documentElement.style.setProperty('--c1', c1);
      document.documentElement.style.setProperty('--c2', c2);
      document.querySelectorAll('.control-group:first-child .btn').forEach(b => b.classList.remove('active'));
      if (activeTab === 'kit85') renderKit85();
    }

    function setView(mode) {
      document.body.classList.remove('auto-mixed');
      document.body.classList.toggle('show-lockup', mode === 'lockup');
    }

    function toggleGuides() {
      const active = document.body.classList.toggle('show-guides');
      document.getElementById('guideBtn').classList.toggle('active', active);
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      document.getElementById('themeBtn').textContent = isDark ? 'Light BG' : 'Dark BG';
      const currentC1 = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
      if (isDark && (currentC1 === '#111113' || currentC1 === '#0F172A')) {
        document.documentElement.style.setProperty('--c1', '#F4F4F6');
        document.getElementById('picker1').value = '#F4F4F6';
      } else if (!isDark && currentC1 === '#F4F4F6') {
        document.documentElement.style.setProperty('--c1', '#111113');
        document.getElementById('picker1').value = '#111113';
      }
    }

    function downloadSvg(id, title) {
      const svgEl = document.getElementById('svg-' + id);
      const c1 = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
      const c2 = getComputedStyle(document.documentElement).getPropertyValue('--c2').trim();
      let raw = svgEl.outerHTML
        .replaceAll('var(--c1)', c1)
        .replaceAll('var(--c2)', c2);
      const blob = new Blob([raw], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `stebup-wordmark-${id}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ─── Export Kit (#85): SVGs, Favicons, PNGs & Zero-Dependency ZIP ───
    function getKitColors() {
      const c1 = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim() || '#111113';
      const c2 = getComputedStyle(document.documentElement).getPropertyValue('--c2').trim() || '#71717A';
      return {
        inkDark: '#111113',
        inkLight: '#F4F4F6',
        c1,
        c2
      };
    }

    function build85MarkPaths(primaryColor, accentColor) {
      return `
        <path fill-rule="evenodd" clip-rule="evenodd" d="
          M148 28 H177 A3 3 0 0 1 180 31 V37 A3 3 0 0 1 177 40 H148 A3 3 0 0 1 145 37 V31 A3 3 0 0 1 148 28 Z
          M151 31.8 A2.2 2.2 0 1 0 151 36.2 A2.2 2.2 0 1 0 151 31.8 Z
          M136 54 H177 A3 3 0 0 1 180 57 V63 A3 3 0 0 1 177 66 H136 A3 3 0 0 1 133 63 V57 A3 3 0 0 1 136 54 Z
          M139 57.8 A2.2 2.2 0 1 0 139 62.2 A2.2 2.2 0 1 0 139 57.8 Z
          M124 80 H177 A3 3 0 0 1 180 83 V89 A3 3 0 0 1 177 92 H124 A3 3 0 0 1 121 89 V83 A3 3 0 0 1 124 80 Z
          M127 83.8 A2.2 2.2 0 1 0 127 88.2 A2.2 2.2 0 1 0 127 83.8 Z
        " fill="${accentColor}" />
        <path d="M127 80 V60 H133 M139 54 V34 H145" fill="none" stroke="${accentColor}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="127" cy="60" r="2.1" fill="${accentColor}" />
        <circle cx="139" cy="34" r="2.1" fill="${accentColor}" />
        <path d="
          M188 28 H215 C228.5 28 237 34 237 43.5 C237 50.5 232.5 55.8 224.5 58.8 C234 61.8 239 67.8 239 76 C239 85.8 229.5 92 215 92 H188 C186.9 92 186 91.1 186 90 V82 C186 80.9 186.9 80 188 80 H213.5 C220.5 80 224 77.5 224 73 C224 68.5 220.5 66 213.5 66 H188 C186.9 66 186 65.1 186 64 V56 C186 54.9 186.9 54 188 54 H212.5 C219 54 222.5 51.5 222.5 47 C222.5 42.8 219 40 212.5 40 H188 C186.9 40 186 39.1 186 38 V30 C186 28.9 186.9 28 188 28 Z
        " fill="${primaryColor}" />
      `;
    }

    function build85WordmarkSvg(theme) {
      const { inkDark, inkLight, c2 } = getKitColors();
      const primary = theme === 'dark' ? inkLight : inkDark;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 120" fill="none">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');</style>
  </defs>
  <text x="128" y="92" text-anchor="end" fill="${primary}" font-family="'Space Grotesk', sans-serif" font-size="91" font-weight="700" letter-spacing="-3.5">ST</text>
  ${build85MarkPaths(primary, c2)}
  <text x="244" y="92" text-anchor="start" fill="${primary}" font-family="'Space Grotesk', sans-serif" font-size="91" font-weight="700" letter-spacing="-3.5">UP</text>
</svg>`;
    }

    function build85MarkSvg(theme) {
      const { inkDark, inkLight, c2 } = getKitColors();
      const primary = theme === 'dark' ? inkLight : inkDark;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 12 136 96" fill="none">
  ${build85MarkPaths(primary, c2)}
</svg>`;
    }

    function build85FaviconSvg() {
      const { c2 } = getKitColors();
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" rx="28" fill="#0B0B0E" />
  <g transform="translate(-85, 16) scale(0.82)">
    ${build85MarkPaths('#F4F4F6', c2)}
  </g>
</svg>`;
    }

    function buildManifestJson() {
      return JSON.stringify({
        name: "Stebup",
        short_name: "Stebup",
        icons: [
          { src: "/android-chrome-192x192.png", sizes: "192x192", type: "image/png" },
          { src: "/android-chrome-512x512.png", sizes: "512x512", type: "image/png" }
        ],
        theme_color: "#0B0B0E",
        background_color: "#0B0B0E",
        display: "standalone"
      }, null, 2);
    }

    const HTML_HEAD_SNIPPET = `<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0B0B0E" />`;

    function triggerDownloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadKitText(content, filename, mime) {
      triggerDownloadBlob(new Blob([content], { type: mime }), filename);
    }

    function svgToPngBlob(svgStr, width, height) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);
          canvas.toBlob(b => (b ? resolve(b) : reject(new Error('PNG export failed'))), 'image/png');
        };
        img.onerror = (err) => {
          URL.revokeObjectURL(url);
          reject(err);
        };
        img.src = url;
      });
    }

    // Renders the wordmark directly to Canvas using the loaded Space Grotesk font so PNGs match 100%
    async function wordmark85ToPngBlob(theme, width = 1600) {
      await document.fonts.ready;
      const height = Math.round((width / 370) * 120);
      const scale = width / 370;
      const { inkDark, inkLight, c2 } = getKitColors();
      const primary = theme === 'dark' ? inkLight : inkDark;

      const markOnlySvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 120" fill="none">${build85MarkPaths(primary, c2)}</svg>`;
      const markBlob = await svgToPngBlob(markOnlySvg, width, height);
      const markImg = await createImageBitmap(markBlob);

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(markImg, 0, 0);

      ctx.fillStyle = primary;
      ctx.font = `700 ${91 * scale}px "Space Grotesk", sans-serif`;
      ctx.letterSpacing = `${-3.5 * scale}px`;
      ctx.textBaseline = 'alphabetic';

      ctx.textAlign = 'right';
      ctx.fillText('ST', 128 * scale, 92 * scale);

      ctx.textAlign = 'left';
      ctx.fillText('UP', 244 * scale, 92 * scale);

      return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    }

    async function downloadFaviconPng(size, filename) {
      const blob = await svgToPngBlob(build85FaviconSvg(), size, size);
      triggerDownloadBlob(blob, filename);
    }

    async function downloadWordmarkPng(theme) {
      const blob = await wordmark85ToPngBlob(theme, 1600);
      triggerDownloadBlob(blob, `stebup-wordmark-${theme}-1600w.png`);
    }

    // Minimal zero-dependency ZIP (STORE method, RFC 1952 CRC32)
    function createZipBlob(files) {
      const crcTable = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        crcTable[i] = c >>> 0;
      }
      const crc32 = (bytes) => {
        let c = 0xFFFFFFFF;
        for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
        return (c ^ 0xFFFFFFFF) >>> 0;
      };

      const enc = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      for (const file of files) {
        const nameBytes = enc.encode(file.name);
        const data = file.bytes;
        const crc = crc32(data);

        const lh = new Uint8Array(30 + nameBytes.length);
        const lv = new DataView(lh.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(6, 0, true);
        lv.setUint16(8, 0, true);
        lv.setUint16(10, 0, true);
        lv.setUint16(12, 0, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, data.length, true);
        lv.setUint32(22, data.length, true);
        lv.setUint16(26, nameBytes.length, true);
        lv.setUint16(28, 0, true);
        lh.set(nameBytes, 30);

        localParts.push(lh, data);

        const ch = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(ch.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0, true);
        cv.setUint16(10, 0, true);
        cv.setUint16(12, 0, true);
        cv.setUint16(14, 0, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, data.length, true);
        cv.setUint32(24, data.length, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint16(30, 0, true);
        cv.setUint16(32, 0, true);
        cv.setUint16(34, 0, true);
        cv.setUint16(36, 0, true);
        cv.setUint32(38, 0, true);
        cv.setUint32(42, offset, true);
        ch.set(nameBytes, 46);

        centralParts.push(ch);
        offset += lh.length + data.length;
      }

      const centralSize = centralParts.reduce((s, p) => s + p.length, 0);
      const eocd = new Uint8Array(22);
      const ev = new DataView(eocd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(4, 0, true);
      ev.setUint16(6, 0, true);
      ev.setUint16(8, files.length, true);
      ev.setUint16(10, files.length, true);
      ev.setUint32(12, centralSize, true);
      ev.setUint32(16, offset, true);
      ev.setUint16(20, 0, true);

      return new Blob([...localParts, ...centralParts, eocd], { type: 'application/zip' });
    }

    async function downloadFullKit85(btn) {
      const origText = btn.textContent;
      btn.textContent = 'Building ZIP...';
      btn.disabled = true;
      try {
        const enc = new TextEncoder();
        const favSvg = build85FaviconSvg();
        const [png16, png32, png180, png192, png512, wordLightPng, wordDarkPng] = await Promise.all([
          svgToPngBlob(favSvg, 16, 16).then(b => b.arrayBuffer()),
          svgToPngBlob(favSvg, 32, 32).then(b => b.arrayBuffer()),
          svgToPngBlob(favSvg, 180, 180).then(b => b.arrayBuffer()),
          svgToPngBlob(favSvg, 192, 192).then(b => b.arrayBuffer()),
          svgToPngBlob(favSvg, 512, 512).then(b => b.arrayBuffer()),
          wordmark85ToPngBlob('light', 1600).then(b => b.arrayBuffer()),
          wordmark85ToPngBlob('dark', 1600).then(b => b.arrayBuffer())
        ]);

        const zipBlob = createZipBlob([
          { name: 'svg/stebup-wordmark-light.svg', bytes: enc.encode(build85WordmarkSvg('light')) },
          { name: 'svg/stebup-wordmark-dark.svg', bytes: enc.encode(build85WordmarkSvg('dark')) },
          { name: 'svg/stebup-mark-light.svg', bytes: enc.encode(build85MarkSvg('light')) },
          { name: 'svg/stebup-mark-dark.svg', bytes: enc.encode(build85MarkSvg('dark')) },
          { name: 'favicon/favicon.svg', bytes: enc.encode(favSvg) },
          { name: 'favicon/favicon-16x16.png', bytes: new Uint8Array(png16) },
          { name: 'favicon/favicon-32x32.png', bytes: new Uint8Array(png32) },
          { name: 'favicon/apple-touch-icon.png', bytes: new Uint8Array(png180) },
          { name: 'favicon/android-chrome-192x192.png', bytes: new Uint8Array(png192) },
          { name: 'favicon/android-chrome-512x512.png', bytes: new Uint8Array(png512) },
          { name: 'favicon/site.webmanifest', bytes: enc.encode(buildManifestJson()) },
          { name: 'png/stebup-wordmark-light-1600w.png', bytes: new Uint8Array(wordLightPng) },
          { name: 'png/stebup-wordmark-dark-1600w.png', bytes: new Uint8Array(wordDarkPng) },
          { name: 'head-snippet.html', bytes: enc.encode(HTML_HEAD_SNIPPET) }
        ]);
        triggerDownloadBlob(zipBlob, 'stebup-logo-85-kit.zip');
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
      }
    }

    function copyHeadSnippet(btn) {
      navigator.clipboard.writeText(HTML_HEAD_SNIPPET).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => (btn.textContent = orig), 1500);
      });
    }

    function renderKit85() {
      const wordLight = build85WordmarkSvg('light');
      const wordDark = build85WordmarkSvg('dark');
      const markLight = build85MarkSvg('light');
      const markDark = build85MarkSvg('dark');
      const favSvg = build85FaviconSvg();

      grid.innerHTML = `

                  <button class="kit-btn" onclick="downloadWordmarkPng('dark')">wordmark-dark-1600w.png</button>

            <!-- Card 2: Standalone EB Mark -->
            <div class="kit-card">
              <div class="kit-previews">

                </div>

                <div class="kit-actions">
                  <button class="kit-btn" onclick="downloadKitText(build85MarkSvg('light'), 'stebup-mark-light.svg', 'image/svg+xml')">stebup-mark-light.svg</button>
                  <button class="kit-btn" onclick="downloadKitText(build85MarkSvg('dark'), 'stebup-mark-dark.svg', 'image/svg+xml')">stebup-mark-dark.svg</button>
                </div>
              </div>
            </div>

            <!-- Card 3: Favicon Suite -->
            <div class="kit-card">
              <div class="kit-favicon-row">
                <div class="kit-fav-item">
                  <div style="width:16px;height:16px;">${favSvg}</div>
                  <span>16px</span>
                </div>
                <div class="kit-fav-item">
                  <div style="width:32px;height:32px;">${favSvg}</div>
                  <span>32px</span>
                </div>
                <div class="kit-fav-item">
                  <div style="width:48px;height:48px;">${favSvg}</div>
                  <span>48px</span>
                </div>
                <div class="kit-fav-item">
                  <div style="width:72px;height:72px;">${favSvg}</div>
                  <span>180px</span>
                </div>
              </div>
              <div class="kit-card-body">
                <h3>Favicon &amp; PWA Icons</h3>
                <p>Drop directly into <code>public/</code> for crisp browser tabs, iOS home screens, and Android manifests.</p>
                <div class="kit-actions">
                  <button class="kit-btn" onclick="downloadKitText(build85FaviconSvg(), 'favicon.svg', 'image/svg+xml')">favicon.svg</button>
                  <button class="kit-btn" onclick="downloadFaviconPng(16, 'favicon-16x16.png')">16×16.png</button>
                  <button class="kit-btn" onclick="downloadFaviconPng(32, 'favicon-32x32.png')">32×32.png</button>
                  <button class="kit-btn" onclick="downloadFaviconPng(180, 'apple-touch-icon.png')">apple-180.png</button>

                  <button class="kit-btn" onclick="downloadFaviconPng(512, 'android-chrome-512x512.png')">512.png</button>
                  <button class="kit-btn" onclick="downloadKitText(buildManifestJson(), 'site.webmanifest', 'application/manifest+json')">site.webmanifest</button>
                </div>
              </div>
            </div>

            <!-- Card 4: HTML Head Snippet -->
            <div class="kit-card full">
              <div class="kit-card-body">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
                  <h3>HTML &lt;head&gt; Setup Snippet</h3>
                  <div class="kit-actions">
                    <button class="kit-btn" onclick="copyHeadSnippet(this)">Copy snippet</button>
                    <button class="kit-btn" onclick="downloadKitText(HTML_HEAD_SNIPPET, 'head-snippet.html', 'text/html')">head-snippet.html</button>
                  </div>
                </div>
                <pre class="kit-code">${HTML_HEAD_SNIPPET.replaceAll('<', '&lt;').replaceAll('>', '&gt;')}</pre>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    render();
  </script>
