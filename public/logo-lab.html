<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stebup — Letter B + Steps Logo Study (2 Colors)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F5F2;
      --card-bg: #FFFFFF;
      --card-border: #E5E3DC;
      --text-main: #111113;
      --text-muted: #6E6D68;
      --c1: #111113; /* Primary Color: Letter B body */
      --c2: #7C3AED; /* Secondary Color: Steps accent */
    }

    body.dark {
      --bg: #0B0B0E;
      --card-bg: #141419;
      --card-border: #24242C;
      --text-main: #F4F4F6;
      --text-muted: #8E8E99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-title span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .control-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 0 6px;
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: rgba(128, 128, 128, 0.1);
    }

    .btn.active {
      background: var(--text-main);
      color: var(--card-bg);
    }

    .swatch-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(128,128,128,0.25);
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--card-border);
      border-radius: 4px;
    }

    .container {
      max-width: 1360px;
      margin: 36px auto 0;
      padding: 0 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08);
    }

    .stage {
      height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
      border-bottom: 1px solid var(--card-border);
    }

    .stage svg.mark-svg {
      width: 140px;
      height: 140px;
      overflow: visible;
    }

    .wordmark-lockup {
      display: none;
      align-items: center;
      gap: 16px;
    }

    body.show-lockup .stage > svg.mark-svg {
      display: none;
    }

    body.show-lockup .stage .wordmark-lockup {
      display: flex;
    }

    .wordmark-lockup svg {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
    }

    .wordmark-text {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--c1);
      line-height: 1;
    }

    .wordmark-text em {
      font-style: normal;
      color: var(--c2);
    }

    .mini-preview {
      position: absolute;
      bottom: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--card-border);
    }

    .mini-preview svg {
      width: 20px;
      height: 20px;
    }

    .mini-preview span {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--c1);
    }

    .num-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .info {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .info-text h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .info-text p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .dl-btn {
      flex-shrink: 0;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-main);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .dl-btn:hover {
      border-color: var(--text-main);
    }

    @media (max-width: 768px) {
      header { padding: 14px 16px; }
      .container { padding: 0 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <h1>Stebup — "B + Steps" Logo Study</h1>
      <span>12 Modern Marks · Strictly 2 Solid Colors</span>
    </div>

    <div class="controls">
      <div class="control-group">
        <span class="control-label">2 Colors</span>
        <button class="btn active" onclick="setPalette('#111113', '#7C3AED', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #7C3AED 50%)"></i>
          Ink + Violet
        </button>
        <button class="btn" onclick="setPalette('#111113', '#F59E0B', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #F59E0B 50%)"></i>
          Ink + Gold
        </button>
        <button class="btn" onclick="setPalette('#0F172A', '#2563EB', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #0F172A 50%, #2563EB 50%)"></i>
          Navy + Blue
        </button>
        <button class="btn" onclick="setPalette('#111113', '#10B981', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #10B981 50%)"></i>
          Ink + Emerald
        </button>
        <button class="btn" onclick="setPalette('#111113', '#71717A', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #71717A 50%)"></i>
          Monochrome
        </button>
        <div class="color-picker-wrap" title="Pick Custom 2 Colors">
          <input type="color" id="picker1" value="#111113" oninput="customColor()" />
          <input type="color" id="picker2" value="#7C3AED" oninput="customColor()" />
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">View</span>
        <button class="btn active" id="viewMarkBtn" onclick="setView('mark')">Symbol Only</button>
        <button class="btn" id="viewLockupBtn" onclick="setView('lockup')">With "Stebup"</button>
      </div>

      <div class="control-group">
        <button class="btn" id="themeBtn" onclick="toggleTheme()">Dark BG</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="grid" id="logoGrid"></div>
  </main>

  <script>
    const concepts = [
      {
        id: "01",
        title: "The Stepped Spine B",
        desc: "The left vertical spine of the B is formed by 3 ascending steps that lock into the twin bowls.",
        svg: `
          <!-- 3 ascending steps on the left spine (Color 2) -->
          <path d="M16 110 V80 H32 V50 H48 V18 H64 V50 H48 V80 H32 V110 H16 Z" fill="var(--c2)" />
          <!-- Right bowls of the B (Color 1) -->
          <path d="
            M64 18 H80 C97 18 108 28 108 42 C108 51 102 59 93 62 C104 65 112 74 112 86 C112 101 99 110 80 110 H32 V92 H78 C87 92 93 88 93 81 C93 74 87 70 78 70 H48 V54 H77 C85 54 90 50 90 43 C90 36 85 33 77 33 H64 V18 Z
          " fill="var(--c1)" />
        `
      },
      {
        id: "02",
        title: "Negative-Space Staircase B",
        desc: "A bold geometric B where the interior counter cutouts form a rising 3-step staircase.",
        svg: `
          <!-- Outer B Monolith (Color 1) -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="
            M22 16 H78 C97 16 108 27 108 42 C108 52 102 59 93 62 C104 65 112 74 112 86 C112 102 98 112 78 112 H22 V16 Z
            M42 34 V94 H76 C85 94 92 89 92 82 C92 75 85 70 76 70 H58 V56 H74 C82 56 88 51 88 45 C88 38 82 34 74 34 H42 Z
          " fill="var(--c1)" />
          <!-- 3-Step Staircase inside the counter (Color 2) -->
          <path d="M42 94 V74 H58 V54 H74 V34 H42 V94 Z" fill="var(--c2)" />
        `
      },
      {
        id: "03",
        title: "3-Pillar Step + Twin Arcs B",
        desc: "Three ascending step bars on the left paired with two sharp geometric B semi-circles on the right.",
        svg: `
          <!-- 3 Ascending Step Pillars (Color 2) -->
          <rect x="14" y="72" width="14" height="38" rx="3" fill="var(--c2)" />
          <rect x="33" y="45" width="14" height="65" rx="3" fill="var(--c2)" />
          <rect x="52" y="18" width="14" height="92" rx="3" fill="var(--c2)" />
          <!-- Twin B Loops (Color 1) -->
          <path d="
            M72 18 H82 C99 18 110 29 110 43 C110 53 103 61 93 64 C104 67 112 76 112 87 C112 101 100 110 82 110 H72 V93 H80 C89 93 94 89 94 82 C94 75 89 71 80 71 H72 V56 H80 C88 56 93 51 93 44 C93 37 88 33 80 33 H72 V18 Z
          " fill="var(--c1)" />
        `
      },
      {
        id: "04",
        title: "Cantilever Step 'b' (Lowercase)",
        desc: "Minimalist lowercase 'b' whose vertical stem climbs upward in 3 crisp geometric steps.",
        svg: `
          <!-- Circular bowl of lowercase b (Color 1) -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="
            M34 64 H70 C92 64 110 75 110 89 C110 103 92 114 70 114 H34 V64 Z
            M52 79 V99 H69 C81 99 90 95 90 89 C90 83 81 79 69 79 H52 Z
          " fill="var(--c1)" />
          <!-- 3 Rising Steps forming the ascender of the 'b' (Color 2) -->
          <path d="M18 64 V46 H34 V28 H50 V12 H68 V30 H52 V48 H36 V64 H18 Z" fill="var(--c2)" />
        `
      },
      {
        id: "05",
        title: "Split-Level Offset B",
        desc: "The upper loop of the B physically steps up and right from the lower loop, anchored by two step risers.",
        svg: `
          <!-- Lower B Loop (Color 1) -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="
            M18 64 H74 C92 64 104 74 104 88 C104 102 92 112 74 112 H18 V64 Z
            M38 79 V97 H71 C80 97 85 93 85 88 C85 83 80 79 71 79 H38 Z
          " fill="var(--c1)" />
          <!-- Upper B Loop shifted right (Color 1) -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="
            M38 16 H86 C102 16 112 26 112 40 C112 54 102 64 86 64 H38 V16 Z
            M56 31 V49 H83 C90 49 94 45 94 40 C94 35 90 31 83 31 H56 Z
          " fill="var(--c1)" />
          <!-- Left Step Treads (Color 2) -->
          <path d="M18 64 V40 H38 V64 H18 Z" fill="var(--c2)" />
        `
      },
      {
        id: "06",
        title: "The Terrace Cut B",
        desc: "Heavy architectural B with its upper-left corner carved into rising stair terraces.",
        svg: `
          <!-- Solid B Body with stepped top-left terrace (Color 1) -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="
            M58 16 H78 C96 16 108 26 108 42 C108 51 102 58 93 61 C104 64 112 73 112 86 C112 102 98 112 78 112 H22 V52 H40 V34 H58 V16 Z
            M44 36 V54 H74 C82 54 88 50 88 45 C88 39 82 36 74 36 H44 Z
            M44 72 V92 H76 C85 92 91 88 91 82 C91 76 85 72 76 72 H44 Z
          " fill="var(--c1)" />
          <!-- Parallel Step Ribbon on Top-Left (Color 2) -->
          <path d="M14 44 H32 V26 H50 V10 H62 V22 H44 V40 H26 V56 H14 V44 Z" fill="var(--c2)" />
        `
      },
      {
        id: "07",
        title: "Continuous Ribbon Step B",
        desc: "A uniform geometric band that climbs 3 steps on the left and loops smoothly into a B on the right.",
        svg: `
          <!-- Left 3-Step Ribbon Spine (Color 2) -->
          <path d="M16 108 V78 H34 V48 H52 V18 H68 V34 H50 V64 H32 V92 H52 V108 H16 Z" fill="var(--c2)" />
          <!-- Right Dual B Loops (Color 1) -->
          <path d="
            M68 18 H82 C99 18 110 28 110 42 C110 51 104 59 95 62 C106 65 112 74 112 85 C112 100 100 108 82 108 H52 V92 H80 C89 92 94 88 94 82 C94 76 89 71 80 71 H50 V55 H80 C88 55 93 51 93 44 C93 38 88 34 80 34 H68 V18 Z
          " fill="var(--c1)" />
        `
      },
      {
        id: "08",
        title: "The Step-Up Crossbar B",
        desc: "The center waist of the B transforms into an ascending step bridge from left to right.",
        svg: `
          <!-- Upper and Lower B Halves (Color 1) -->
          <path d="
            M24 16 H78 C96 16 108 26 108 41 C108 48 105 54 99 58 H80 C86 55 89 49 89 43 C89 36 84 32 75 32 H44 V54 H24 V16 Z
            M24 82 H44 V96 H76 C86 96 92 91 92 84 C92 78 87 74 78 73 H101 C108 78 112 85 112 94 C112 105 98 112 78 112 H24 V82 Z
          " fill="var(--c1)" />
          <!-- Center Ascending Step Crossbar (Color 2) -->
          <path d="M14 78 H58 V62 H102 V46 H46 V62 H14 V78 Z" fill="var(--c2)" />
        `
      },
      {
        id: "09",
        title: "Inside-Bowl Staircase 'b'",
        desc: "Clean modern lowercase 'b' housing a sharp 3-step staircase inside its circular counter.",
        svg: `
          <!-- Outer lowercase 'b' ring + stem (Color 1) -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="
            M22 14 H42 V48 C49 42 59 38 70 38 C94 38 112 56 112 78 C112 100 94 116 68 116 C55 116 45 112 38 105 V114 H22 V14 Z
            M42 77 C42 91 52 100 66 100 C81 100 92 91 92 77 C92 63 81 54 66 54 C52 54 42 63 42 77 Z
          " fill="var(--c1)" />
          <!-- 3-Step Staircase inside the bowl (Color 2) -->
          <path d="M46 95 V83 H58 V71 H70 V59 H85 V95 H46 Z" fill="var(--c2)" />
        `
      },
      {
        id: "10",
        title: "Cornerstone Step Foundation B",
        desc: "A 3-step staircase block at the bottom-left foundation elevates the upper B structure.",
        svg: `
          <!-- Elevated Upper B (Color 1) -->
          <path d="
            M38 14 H80 C98 14 110 24 110 39 C110 48 104 55 95 58 C106 61 112 70 112 82 C112 98 99 108 80 108 H64 V91 H78 C87 91 93 87 93 80 C93 73 87 69 78 69 H64 V52 H78 C86 52 91 48 91 41 C91 34 86 30 78 30 H56 V52 H38 V14 Z
          " fill="var(--c1)" />
          <!-- 3-Step Base Cornerstone (Color 2) -->
          <path d="M16 112 V92 H30 V72 H44 V52 H58 V112 H16 Z" fill="var(--c2)" />
        `
      },
      {
        id: "11",
        title: "Staggered Horizontal Step Slabs B",
        desc: "Three rising horizontal step bars on the left that lock into the curved right loops of the B.",
        svg: `
          <!-- 3 Staggered Horizontal Step Slabs (Color 2) -->
          <rect x="12" y="88" width="48" height="20" rx="4" fill="var(--c2)" />
          <rect x="24" y="54" width="48" height="20" rx="4" fill="var(--c2)" />
          <rect x="36" y="20" width="48" height="20" rx="4" fill="var(--c2)" />
          <!-- Right Curved B Loops (Color 1) -->
          <path d="
            M72 20 H84 C100 20 110 29 110 42 C110 52 104 60 94 63 C105 66 112 75 112 87 C112 100 102 108 84 108 H64 V88 H81 C88 88 93 84 93 78 C93 72 88 68 81 68 H72 V54 H80 C87 54 91 50 91 44 C91 39 87 35 80 35 H72 V20 Z
          " fill="var(--c1)" />
        `
      },
      {
        id: "12",
        title: "Diagonal Step-Apex B",
        desc: "Sharp modern B where the left stem steps upward in two crisp increments to a 45° apex.",
        svg: `
          <!-- Left Stepped Stem with 45° Apex (Color 2) -->
          <path d="M18 112 V74 L32 60 V36 L52 16 V112 H34 V78 L18 94 Z" fill="var(--c2)" />
          <path d="M18 112 V72 H34 V42 H50 V16 H64 V112 H18 Z" fill="var(--c2)" opacity="0" />
          <!-- Clean 2-Step Chamfered Spine (Color 2) -->
          <polygon points="18,112 18,74 34,58 34,32 50,16 50,112" fill="var(--c2)" />
          <!-- Twin Geometric B Loops (Color 1) -->
          <path d="
            M56 16 H80 C98 16 110 27 110 42 C110 52 104 59 94 62 C105 65 112 74 112 86 C112 102 99 112 80 112 H56 V94 H78 C87 94 93 89 93 82 C93 75 87 70 78 70 H56 V54 H77 C85 54 91 49 91 42 C91 35 85 31 77 31 H56 V16 Z
          " fill="var(--c1)" />
        `
      }
    ];

    const grid = document.getElementById('logoGrid');

    function render() {
      grid.innerHTML = concepts.map(item => `
        <div class="card">
          <div class="stage">
            <span class="num-badge">#${item.id}</span>

            <svg class="mark-svg" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" id="svg-${item.id}">
              ${item.svg}
            </svg>

            <div class="wordmark-lockup">
              <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                ${item.svg}
              </svg>
              <span class="wordmark-text">Ste<em>b</em>up</span>
            </div>

            <div class="mini-preview" title="20px Navbar Scale">
              <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                ${item.svg}
              </svg>
              <span>Stebup</span>
            </div>
          </div>

          <div class="info">
            <div class="info-text">
              <h2>${item.title}</h2>
              <p>${item.desc}</p>
            </div>
            <button class="dl-btn" onclick="downloadSvg('${item.id}', '${item.title}')">SVG</button>
          </div>
        </div>
      `).join('');
    }

    function setPalette(c1, c2, btn) {
      const isDark = document.body.classList.contains('dark');
      const resolvedC1 = (isDark && (c1 === '#111113' || c1 === '#0F172A')) ? '#F4F4F6' : c1;
      document.documentElement.style.setProperty('--c1', resolvedC1);
      document.documentElement.style.setProperty('--c2', c2);
      document.getElementById('picker1').value = resolvedC1;
      document.getElementById('picker2').value = c2;

      if (btn) {
        document.querySelectorAll('.control-group:first-child .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    }

    function customColor() {
      const c1 = document.getElementById('picker1').value;
      const c2 = document.getElementById('picker2').value;
      document.documentElement.style.setProperty('--c1', c1);
      document.documentElement.style.setProperty('--c2', c2);
      document.querySelectorAll('.control-group:first-child .btn').forEach(b => b.classList.remove('active'));
    }

    function setView(mode) {
      document.body.classList.toggle('show-lockup', mode === 'lockup');
      document.getElementById('viewMarkBtn').classList.toggle('active', mode === 'mark');
      document.getElementById('viewLockupBtn').classList.toggle('active', mode === 'lockup');
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      document.getElementById('themeBtn').textContent = isDark ? 'Light BG' : 'Dark BG';
      const currentC1 = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
      if (isDark && (currentC1 === '#111113' || currentC1 === '#0F172A')) {
        document.documentElement.style.setProperty('--c1', '#F4F4F6');
        document.getElementById('picker1').value = '#F4F4F6';
      } else if (!isDark && currentC1 === '#F4F4F6') {
        document.documentElement.style.setProperty('--c1', '#111113');
        document.getElementById('picker1').value = '#111113';
      }
    }

    function downloadSvg(id, title) {
      const svgEl = document.getElementById('svg-' + id);
      const c1 = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
      const c2 = getComputedStyle(document.documentElement).getPropertyValue('--c2').trim();
      let raw = svgEl.outerHTML
        .replaceAll('var(--c1)', c1)
        .replaceAll('var(--c2)', c2);
      const blob = new Blob([raw], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `stebup-b-steps-${id}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    render();
  </script>
</body>
</html>
