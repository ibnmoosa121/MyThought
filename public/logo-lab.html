<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stebup — Logo Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F5F2;
      --card-bg: #FFFFFF;
      --card-border: #E5E3DC;
      --text-main: #111113;
      --text-muted: #6E6D68;
      --c1: #111113; /* Primary Color: Wordmark & B Rounds */
      --c2: #71717A; /* Secondary Color: E Horizontal Slips / Step Accent */
    }

    body.dark {
      --bg: #0B0B0E;
      --card-bg: #141419;
      --card-border: #24242C;
      --text-main: #F4F4F6;
      --text-muted: #8E8E99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-title span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--bg);
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .control-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 0 6px;
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: rgba(128, 128, 128, 0.1);
    }

    .btn.active {
      background: var(--text-main);
      color: var(--card-bg);
    }

    .swatch-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(128,128,128,0.25);
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--card-border);
      border-radius: 4px;
    }

    .tab-bar {
      max-width: 1360px;
      margin: 24px auto 0;
      padding: 0 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .tab-btn.active {
      background: var(--text-main);
      color: var(--card-bg);
      border-color: var(--text-main);
    }

    .tab-count {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(128, 128, 128, 0.18);
    }

    .tab-desc-banner {
      max-width: 1360px;
      margin: 16px auto 0;
      padding: 0 32px;
    }

    .tab-desc-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      line-height: 1.5;
    }

    .tab-desc-box strong {
      color: var(--text-main);
    }

    .container {
      max-width: 1360px;
      margin: 20px auto 0;
      padding: 0 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(410px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08);
    }

    .stage {
      height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
      border-bottom: 1px solid var(--card-border);
    }

    .stage svg.mark-svg {
      width: 140px;
      height: 140px;
      overflow: visible;
    }

    .stage svg.word-svg {
      width: 100%;
      max-width: 345px;
      height: auto;
      overflow: visible;
      display: none;
    }

    .wordmark-lockup {
      display: none;
      align-items: center;
      gap: 14px;
    }

    body.show-lockup .stage > svg.mark-svg,
    body.auto-mixed .stage.is-word > svg.mark-svg {
      display: none;
    }

    body.show-lockup .stage > svg.word-svg,
    body.auto-mixed .stage.is-word > svg.word-svg {
      display: block;
    }

    body.show-lockup .stage .wordmark-lockup {
      display: flex;
    }

    .wordmark-lockup svg {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .wordmark-text {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--c1);
      line-height: 1;
    }

    .wordmark-text em {
      font-style: normal;
      color: var(--c2);
    }

    .guide-line {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    body.show-guides .guide-line {
      opacity: 1;
    }

    .mini-preview {
      position: absolute;
      bottom: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--card-border);
    }

    .mini-preview svg.mini-word {
      width: 86px;
      height: 24px;
    }

    .mini-preview svg.mini-mark {
      width: 22px;
      height: 22px;
    }

    .mini-preview span {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--c1);
    }

    .num-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .cat-pill {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .info {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .info-text h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .info-text p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .dl-btn {
      flex-shrink: 0;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-main);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .dl-btn:hover {
      border-color: var(--text-main);
    }

    @media (max-width: 768px) {
      header { padding: 14px 16px; }
      .tab-bar, .tab-desc-banner, .container { padding: 0 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="auto-mixed">

  <header>
    <div class="controls">
      <div class="control-group">
        <span class="control-label">Colors</span>
        <button class="btn" onclick="setPalette('#111113', '#7C3AED', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #7C3AED 50%)"></i>
          Ink + Violet
        </button>
        <button class="btn" onclick="setPalette('#111113', '#F59E0B', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #F59E0B 50%)"></i>
          Ink + Gold
        </button>
        <button class="btn" onclick="setPalette('#0F172A', '#2563EB', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #0F172A 50%, #2563EB 50%)"></i>
          Navy + Blue
        </button>
        <button class="btn" onclick="setPalette('#111113', '#10B981', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #10B981 50%)"></i>
          Ink + Emerald
        </button>
        <button class="btn active" onclick="setPalette('#111113', '#71717A', this)">
          <i class="swatch-dot" style="background: linear-gradient(135deg, #111113 50%, #71717A 50%)"></i>
          Monochrome
        </button>
        <div class="color-picker-wrap" title="Pick Custom Colors">
          <input type="color" id="picker1" value="#111113" oninput="customColor()" />
          <input type="color" id="picker2" value="#71717A" oninput="customColor()" />
        </div>
      </div>
    </div>
  </header>

  <!-- Category Tabs -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="setTab('improvised', this)">
      Improvised <span class="tab-count">20</span>
    </button>
    <button class="tab-btn" onclick="setTab('symbols', this)">
      EB Symbols <span class="tab-count">12</span>
    </button>
    <button class="tab-btn" onclick="setTab('wordmarks', this)">
      STEBUP Wordmarks <span class="tab-count">25</span>
    </button>
    <button class="tab-btn" onclick="setTab('b_marks', this)">
      B + Steps &amp; Tech <span class="tab-count">28</span>
    </button>
  </nav>

  <main class="container">
    <div class="grid" id="logoGrid"></div>
  </main>

  <script>
    // Precision geometric paths for S, T (left of EB) and U, P (right of EB)
    // Cap-height: y = 28 | Baseline: y = 92 | Total Height = 64px | Stroke = 14px
    const ST_PATH = `
      <!-- S (x=16..64, y=28..92, 14px stroke) -->
      <path d="
        M62 28 H32 C22 28 16 34 16 44 C16 54 22 60 34 62 L46 64 C50 65 51 67 51 71 C51 75 48 78 42 78 H16 V92 H44 C56 92 64 85 64 73 C64 62 58 56 45 54 L34 52 C30 51 29 49 29 45 C29 43 31 42 36 42 H62 V28 Z
      " fill="var(--c1)" />
      <!-- T (x=72..120, y=28..92, 14px stroke) -->
      <path d="M72 28 H120 V42 H103 V92 H89 V42 H72 V28 Z" fill="var(--c1)" />
    `;

    const UP_PATH = `
      <!-- U (x=244..294, y=28..92, 14px stroke) -->
      <path d="
        M244 28 H258 V68 C258 75 262 78 269 78 C276 78 280 75 280 68 V28 H294 V69 C294 84 284 92 269 92 C254 92 244 84 244 69 V28 Z
      " fill="var(--c1)" />
      <!-- P (x=304..354, y=28..92, 14px stroke) -->
      <path fill-rule="evenodd" clip-rule="evenodd" d="
        M304 28 H334 C346 28 354 36 354 48 C354 60 346 68 334 68 H318 V92 H304 V28 Z
        M318 42 V54 H332 C337 54 340 52 340 48 C340 44 337 42 332 42 H318 Z
      " fill="var(--c1)" />
    `;

    const GUIDE_LINES = `
      <line class="guide-line" x1="6" y1="28" x2="364" y2="28" stroke="#EF4444" stroke-width="1" stroke-dasharray="4 3" />
      <line class="guide-line" x1="6" y1="92" x2="364" y2="92" stroke="#EF4444" stroke-width="1" stroke-dasharray="4 3" />
    `;

    function makeWordConcept(id, cat, catLabel, title, desc, ebPaths, customWordSvg = null) {
      return {
        id,
        cat,
        catLabel,
        isSeamlessEB: true,
        title,
        desc,
        wordSvg: customWordSvg || `
          ${GUIDE_LINES}
          ${ST_PATH}
          ${ebPaths}
          ${UP_PATH}
        `,
        markViewBox: "118 16 126 88",
        svg: ebPaths
      };
    }

    const concepts = [
      // =========================================================================
      // ★ IMPROVISED TAB: REFINED & UPGRADED WITH MODERN TECH BRAND STANDARDS (65 - 80)
      // Based on: 53, 54, 58, 60, 62, 41, 45, 47, 48, 32, 33, 40, 01, 03, 11, 14
      // =========================================================================
      {
        id: "65",
        cat: "improvised",
        catLabel: "From #53 · Kinetic + Squircle",
        title: "Kinetic Launch-Arrow 'EB' in Squircle",
        desc: "Refines #53: natively plotted kinetic geometry (no blurry transforms) inside a 5.5px machined squircle, slicing a razor-sharp upward launch arrow (↑) between E and B.",
        svg: `
          <!-- Outer machined squircle housing (Color 1) -->
          <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="var(--c1)" stroke-width="5.5" />
          <!-- Native precision-plotted Kinetic Mark with 7deg lean & crisp inner chamfers -->
          <g transform="translate(64,64) skewX(-7) translate(-64,-64)">
            <!-- 3 Stepped E-Slips sculpting left wing of center arrow (Color 2) -->
            <path d="M35 30 H62 L51 43 H35 C33.3 43 32 41.7 32 40 V33 C32 31.3 33.3 30 35 30 Z" fill="var(--c2)" />
            <path d="M29 57.5 H57 C58.7 57.5 60 58.8 60 60.5 V67.5 C60 69.2 58.7 70.5 57 70.5 H29 C27.3 70.5 26 69.2 26 67.5 V60.5 C26 58.8 27.3 57.5 29 57.5 Z" fill="var(--c2)" />
            <path d="M23 85 H57 C58.7 85 60 86.3 60 88 V95 C60 96.7 58.7 98 57 98 H23 C21.3 98 20 96.7 20 95 V88 C20 86.3 21.3 85 23 85 Z" fill="var(--c2)" />
            <!-- Stemless B Rounds sculpting right wing of center arrow (Color 1) -->
            <path d="
              M71 30 H91 C102 30 109 36.5 109 46 C109 52.5 104.5 57.5 97 60 C105.5 62.5 111 69 111 78 C111 89 102.5 98 90 98 H69 C67.3 98 66 96.7 66 95 V88 C66 86.3 67.3 85 69 85 H88.5 C94 85 97.5 82 97.5 77.5 C97.5 73 94 70.5 88.5 70.5 H69 C67.3 70.5 66 69.2 66 67.5 V60.5 C66 58.8 67.3 57.5 69 57.5 H88 C93 57.5 96.5 54.5 96.5 50 C96.5 45.5 93 43 88 43 H82 L71 30 Z
            " fill="var(--c1)" />
          </g>
        `
      },
      {
        id: "66",
        cat: "improvised",
        catLabel: "From #54 · Tapered Fluid",
        title: "Aerodynamic Turbine-Foil 'EB'",
        desc: "Upgrades #54: sculpts E's 3 slips as curved cubic-Bezier airfoil blades converging organically into pill-softened stemless B loops across a uniform 7px channel.",
        svg: `
          <!-- 3 Curved Airfoil E-Slips with smooth terminal radii (Color 2) -->
          <path d="M27 25 C40 23 54 21 66 20 C69.3 20 72 22.7 72 26 V31 C72 34.3 69.3 37 66 37 C54 36.5 40 34.5 27 32 C24.5 31.5 23 30 23 28.5 C23 27 24.5 25.5 27 25 Z" fill="var(--c2)" />
          <path d="M16 60.5 C31 59 45 57 56 56 C59.3 56 62 58.7 62 62 V66 C62 69.3 59.3 72 56 72 C45 71 31 69.5 16 67.5 C13.5 67 12 65.6 12 64 C12 62.4 13.5 61 16 60.5 Z" fill="var(--c2)" />
          <path d="M8 96.5 C26 94.5 48 92.5 66 91.5 C69.3 91.5 72 94.2 72 97.5 V102 C72 105.3 69.3 108 66 108 C48 107.2 26 105.2 8 103.2 C5.5 102.8 4 101.4 4 99.8 C4 98.2 5.5 96.8 8 96.5 Z" fill="var(--c2)" />
          <!-- Pill-Softened Stemless B Loops across clean 7px channel (Color 1) -->
          <path d="
            M85 20 H96 C111 20 120 29 120 41.5 C120 51 113 59 102 62 C114 65 122 74 122 86 C122 99 111 108 96 108 H85 C80.6 108 77 104.4 77 100 C77 95.6 80.6 92 85 92 H94 C102 92 106 88 106 82 C106 76 102 72 94 72 H75 C70.6 72 67 68.4 67 64 C67 59.6 70.6 56 75 56 H93 C100 56 104 52 104 45.5 C104 39.5 100 36 93 36 H85 C80.6 36 77 32.4 77 28 C77 23.6 80.6 20 85 20 Z
          " fill="var(--c1)" />
        `
      },
      {
        id: "67",
        cat: "improvised",
        catLabel: "From #58 · Squircle Badge",
        title: "True-Cutout Bauhaus Squircle 'EB' Icon",
        desc: "Upgrades #58 for true transparent SVG export: punches the twin Bauhaus D-domes directly through the solid squircle via evenodd geometry with uniform 11px E-slips.",
        svg: `
          <!-- Solid Squircle with True Transparent Punch-Outs for B Domes (Color 1) -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="
            M36 10 H92 C106.4 10 118 21.6 118 36 V92 C118 106.4 106.4 118 92 118 H36 C21.6 118 10 106.4 10 92 V36 C10 21.6 21.6 10 36 10 Z
            M68 28 H84 C98 28 107 35 107 44.5 C107 54 98 61 84 61 H68 V28 Z
            M77 39 V50 H83.5 C89.5 50 93.5 47.8 93.5 44.5 C93.5 41.2 89.5 39 83.5 39 H77 Z
            M68 67 H85 C99 67 108 74 108 83.5 C108 93 99 100 85 100 H68 V67 Z
            M77 78 V89 H84.5 C90.5 89 94.5 86.8 94.5 83.5 C94.5 80.2 90.5 78 84.5 78 H77 Z
          " fill="var(--c1)" />
          <!-- 3 Uniform 11px Stepped E-Slips (Color 2) -->
          <rect x="34" y="28" width="26" height="11" rx="2.5" fill="var(--c2)" />
          <rect x="27" y="58.5" width="33" height="11" rx="2.5" fill="var(--c2)" />
          <rect x="20" y="89" width="40" height="11" rx="2.5" fill="var(--c2)" />
        `
      },
      {
        id: "68",
        cat: "improvised",
        catLabel: "From #60 · Single Stroke",
        title: "Continuous Single-Stroke Diagonal 'EB'",
        desc: "Refines #60: mathematically parallel 16px slanted spine with 45° terminals forms E in one unbroken stroke, separated by an 8px parallel channel from B.",
        svg: `
          <!-- Mathematically Parallel 16px Single-Stroke Slanted E (Color 2) -->
          <path d="
            M28 20 H72 L56 36 H40.4 L35.8 56 H58 L42 72 H32.2 L27.6 92 H46 L30 108 H8 L28 20 Z
          " fill="var(--c2)" />
          <!-- Matching 45-deg Terminal Stemless B Rounds with 8px parallel gap (Color 1) -->
          <path d="
            M80 20 H96 C110 20 120 29 120 42 C120 52 113 59 102 63 C113 66 120 75 120 87 C120 100 109 108 92 108 H38 L54 92 H90 C98 92 103 88 103 81.5 C103 75.5 98 72 90 72 H50 L66 56 H92 C99 56 103 51.5 103 45 C103 39 99 36 92 36 H64 L80 20 Z
          " fill="var(--c1)" />
        `
      },
      {
        id: "69",
        cat: "improvised",
        catLabel: "From #62 · AI Spark Crest",
        title: "AI-Spark Crown 'EB' Crest",
        desc: "Refines #62: sweeps E's top slip and B's upper arch symmetrically to cradle a crisp 4-point AI spark (✦) at the crown zenith.",
        svg: `
          <!-- 3 Radial-Fan Crown-Pitched E-Slips cradling center apex (Color 2) -->
          <path d="M19 36 L47 23 C49.5 21.8 52 23.3 52 26 V33.5 C52 35.2 51 36.7 49.4 37.5 L21 50.5 C18.5 51.6 16 50.1 16 47.4 V40.5 C16 38.5 17.2 36.8 19 36 Z" fill="var(--c2)" />
          <path d="M13 68 L48 52 C50.5 50.8 53 52.3 53 55 V63 C53 64.7 52 66.2 50.4 67 L15 83 C12.5 84.1 10 82.6 10 79.9 V72.5 C10 70.5 11.2 68.8 13 68 Z" fill="var(--c2)" />
          <path d="M8 100 L50 81 C52.5 79.8 55 81.3 55 84 V92 C55 93.7 54 95.2 52.4 96 L10 115 C7.5 116.1 5 114.6 5 111.9 V104.5 C5 102.5 6.2 100.8 8 100 Z" fill="var(--c2)" />
          <!-- Twin B Rounds starting cleanly at x=75 to frame the spark (Color 1) -->
          <path d="
            M79 23 L111 35.5 C118 38.3 122 44 122 51.5 C122 59.5 117 64.5 108 67.5 C118 71.5 123 78.5 123 88 C123 100 113 108 97 108 H78 C75.8 108 74 106.2 74 104 V94 C74 91.8 75.8 90 78 90 H95 C102 90 106 87 106 83 C106 78 102 74 95 72 L75 64.5 V50.5 L95 58 C101 60 104 57 104 52 C104 47 101 44 95 42 L78 35.5 C76.6 35 76 33.8 76 32.3 V25.3 C76 23.2 77.2 22.2 79 23 Z
          " fill="var(--c1)" />
          <!-- Bold Cradled 4-Point AI Spark at Crown Zenith (x=64, y=22) -->
          <path d="M64 8 L67.6 18.4 L78 22 L67.6 25.6 L64 36 L60.4 25.6 L50 22 L60.4 18.4 Z" fill="var(--c2)" />
        `
      },

      // =========================================================================
      // WORDMARK IMPROVISATIONS (70 - 76) — From 41, 45, 47, 48, 32, 33, 40
      // Engineered with optical density balance, tight ST-EB-UP kerning, 3px machined corners & kinetic flow
      // =========================================================================
      makeWordConcept(
        "70",

    let activeTab = 'improvised';
    const grid = document.getElementById('logoGrid');

    function setTab(tab, btn) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      if (tab === 'improvised') {
        document.body.classList.remove('show-lockup');
        document.body.classList.add('auto-mixed');
      } else if (tab === 'wordmarks') {
        document.body.classList.remove('auto-mixed');
        document.body.classList.add('show-lockup');
      } else {
        document.body.classList.remove('auto-mixed');
        document.body.classList.remove('show-lockup');
      }
      render();
    }

    function render() {
      const allowedCats = tabGroups[activeTab] || [];
      const filtered = concepts.filter(c => allowedCats.includes(c.cat));

      grid.innerHTML = filtered.map(item => {
        if (item.isSeamlessEB) {
          return `
            <div class="card">
              <div class="stage is-word">
                <span class="num-badge">#${item.id}</span>
                <span class="cat-pill">${item.catLabel}</span>

                <!-- Standalone EB Symbol (when in Symbol Only view) -->
                <svg class="mark-svg" viewBox="${item.markViewBox}" fill="none" xmlns="http://www.w3.org/2000/svg">
                  ${item.svg}
                </svg>

                <!-- Full Seamless STEBUP Wordmark -->
                <svg class="word-svg" viewBox="0 0 370 120" fill="none" xmlns="http://www.w3.org/2000/svg" id="svg-${item.id}">
                  ${item.wordSvg}
                </svg>

                <!-- Mini Navbar Scale Preview -->
                <div class="mini-preview" title="Navbar Scale Preview">
                  <svg class="mini-word" viewBox="0 0 370 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    ${item.wordSvg}
                  </svg>
                </div>
              </div>

              <div class="info">
                <div class="info-text">
                  <h2>${item.title}</h2>
                  <p>${item.desc}</p>
                </div>
                <button class="dl-btn" onclick="downloadSvg('${item.id}', '${item.title}')">SVG</button>
              </div>
            </div>
          `;
        }

        return `
          <div class="card">
            <div class="stage">
              <span class="num-badge">#${item.id}</span>
              <span class="cat-pill">${item.catLabel}</span>

              <svg class="mark-svg" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" id="svg-${item.id}">

              </svg>

              <div class="wordmark-lockup">
                <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">

                </svg>
                <span class="wordmark-text">Ste<em>b</em>up</span>
              </div>

              <div class="mini-preview" title="Navbar Scale Preview">
                <svg class="mini-mark" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                  ${item.svg}

    }

    function setPalette(c1, c2, btn) {
      const isDark = document.body.classList.contains('dark');
      const resolvedC1 = (isDark && (c1 === '#111113' || c1 === '#0F172A')) ? '#F4F4F6' : c1;
      document.documentElement.style.setProperty('--c1', resolvedC1);
      document.documentElement.style.setProperty('--c2', c2);
      document.getElementById('picker1').value = resolvedC1;
      document.getElementById('picker2').value = c2;

      if (btn) {
        document.querySelectorAll('.control-group:first-child .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    }

    function customColor() {
      const c1 = document.getElementById('picker1').value;
      const c2 = document.getElementById('picker2').value;
      document.documentElement.style.setProperty('--c1', c1);
      document.documentElement.style.setProperty('--c2', c2);
      document.querySelectorAll('.control-group:first-child .btn').forEach(b => b.classList.remove('active'));
    }

    function setView(mode) {
      document.body.classList.remove('auto-mixed');
      document.body.classList.toggle('show-lockup', mode === 'lockup');
    }

    function toggleGuides() {
      const active = document.body.classList.toggle('show-guides');
      document.getElementById('guideBtn').classList.toggle('active', active);
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      document.getElementById('themeBtn').textContent = isDark ? 'Light BG' : 'Dark BG';
      const currentC1 = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
      if (isDark && (currentC1 === '#111113' || currentC1 === '#0F172A')) {
        document.documentElement.style.setProperty('--c1', '#F4F4F6');
        document.getElementById('picker1').value = '#F4F4F6';
      } else if (!isDark && currentC1 === '#F4F4F6') {
        document.documentElement.style.setProperty('--c1', '#111113');
        document.getElementById('picker1').value = '#111113';
      }
    }

    function downloadSvg(id, title) {
      const svgEl = document.getElementById('svg-' + id);
      const c1 = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
      const c2 = getComputedStyle(document.documentElement).getPropertyValue('--c2').trim();
      let raw = svgEl.outerHTML
        .replaceAll('var(--c1)', c1)
        .replaceAll('var(--c2)', c2);
      const blob = new Blob([raw], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `stebup-wordmark-${id}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    render();
  </script>
